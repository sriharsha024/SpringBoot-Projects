spring.application.name=event-management

spring.datasource.url=jdbc:mysql://localhost:3306/projects
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuators
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

info.app.name=Event Management Application
info.app.description=The Event Management Application is a user-friendly tool for efficiently planning, organizing, and managing events from start to finish.
info.app.version=3.2.5

management.info.env.enabled=true
management.endpoint.shutdown.enabled=true
server.shutdown=graceful
